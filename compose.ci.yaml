name: videoflix-ci

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: videoflix_ci
      POSTGRES_USER: videoflix_ci
      POSTGRES_PASSWORD: videoflix_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoflix_ci -d videoflix_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-32-bytes
      DEBUG: "True"
      SECURE_SSL_REDIRECT: "False"

      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      FRONTEND_URL: http://127.0.0.1:5500

      DB_NAME: videoflix_ci
      DB_USER: videoflix_ci
      DB_PASSWORD: videoflix_ci
      DB_HOST: db
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_LOCATION: redis://redis:6379/1
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-only
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      DEFAULT_FROM_EMAIL: ci@example.invalid

      COVERAGE_FILE: /tmp/.coverage
