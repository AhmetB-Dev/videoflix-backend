name: videoflix-ci

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: videoflix_ci
      POSTGRES_USER: videoflix_ci
      POSTGRES_PASSWORD: videoflix_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoflix_ci -d videoflix_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SECRET_KEY: ci-only-9f7c2a4e6d8b1f3a5c7e9d2b4f6a8c1e3d5b7f9a2c4e6d8b1f3a5c7e9d2b4f6a
      DEBUG: "True"
      SECURE_SSL_REDIRECT: "False"

      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      FRONTEND_URL: http://127.0.0.1:5500

      DB_NAME: videoflix_ci
      DB_USER: videoflix_ci
      DB_PASSWORD: videoflix_ci
      DB_HOST: db
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_LOCATION: redis://redis:6379/1
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-only
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      DEFAULT_FROM_EMAIL: ci@example.invalid

      COVERAGE_FILE: /tmp/.coverage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        python -m pip check &&
        python manage.py check &&
        DEBUG=False \
        SECURE_SSL_REDIRECT=True \
        SECURE_HSTS_SECONDS=31536000 \
        SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
        SECURE_HSTS_PRELOAD=True \
        python manage.py check --deploy --fail-level WARNING &&
        coverage erase &&
        coverage run --source=users,videos manage.py test &&
        coverage report --fail-under=95
