<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; color: #535456;">
    <div style="max-width: 650px; margin: 0 auto; padding: 40px 24px;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 style="color: #2e3edf; margin: 0; font-size: 42px;">
                VIDEOFLIX
            </h1>
        </div>

        <p>Dear user,</p>

        <p>
            We received a request to reset your
            <strong style="color: #2e3edf;">Videoflix</strong>
            password.
        </p>

        <p>
            Please click the button below to choose a new password:
        </p>

        <div style="margin: 32px 0;">
            <a href="{{ reset_url }}"
               style="
                    display: inline-block;
                    background: #2e3edf;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 14px 28px;
                    border-radius: 28px;
                    font-weight: 700;
               ">
                Reset password
            </a>
        </div>

        <p>
            If you did not request a password reset,
            please disregard this email.
        </p>

        <p style="margin-top: 32px;">Best regards,</p>
        <p>Your Videoflix Team.</p>
    </div>
</body>
</html>
