name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: AhmetB-Dev/django-devops-template/.github/workflows/reusable-ci.yml@v1

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: AhmetB-Dev/django-devops-template/.github/workflows/reusable-publish.yml@v1

  production-gate:
    name: Production gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Authorize production deployment
        run: echo "Production deployment authorized."

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, production-gate]
    permissions:
      contents: read
      packages: read
    uses: AhmetB-Dev/django-devops-template/.github/workflows/reusable-deploy.yml@v1
    with:
      image: ${{ needs.publish.outputs.image }}:sha-${{ github.sha }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
