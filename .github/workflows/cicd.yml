name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: AhmetB-Dev/django-deployment-template/.github/workflows/reusable-ci.yml@main

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: AhmetB-Dev/django-deployment-template/.github/workflows/reusable-publish.yml@main

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: AhmetB-Dev/django-deployment-template/.github/workflows/reusable-deploy.yml@main
    with:
      vps-user: ${{ vars.VPS_USER }}
      vps-app-dir: ${{ vars.VPS_APP_DIR }}
      image: ${{ needs.publish.outputs.image }}:sha-${{ github.sha }}
    secrets:
      vps-host: ${{ secrets.VPS_HOST }}
      vps-ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      vps-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
